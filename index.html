<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Rare Grade Tech — Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Montserrat:ital,wght@1,800&display=swap" rel="stylesheet" />
<style>
  :root{
    --blue-900:#0A0E5A;
    --blue-800:#0D12A0;
    --blue-700:#1118F5;
    --blue-accent:#3B4CFF;
    --ink:#05060B;
    --white:#FFFFFF;
    --line:rgba(255,255,255,.16);
    --line-soft:rgba(255,255,255,.10);
    --glass:rgba(255,255,255,.07);
    --text-dim:rgba(255,255,255,.78);
    --text-faint:rgba(255,255,255,.58);
    --surface:#F5F6FC;
    --surface-alt:#FFFFFF;
    --card-line:#E5E7F6;
    --ink-900:#090B25;
    --ink-600:#54566F;
    --ink-400:#8688A0;
    --radius-s:10px;
    --radius-m:16px;
    --radius-l:28px;
    --container:1360px;
    --gap:8px;
    --nav-h:72px;
    --sidebar-w:280px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;
    background:var(--surface);
    color:var(--ink-900);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;}
  input,textarea,select{font-family:inherit;}
  ul{margin:0;padding:0;list-style:none;}

  /* ============ Scroll reveal (matches site) ============ */
  .reveal{opacity:0;transform:translateY(36px);transition:opacity .8s cubic-bezier(.16,.84,.44,1),transform .8s cubic-bezier(.16,.84,.44,1);}
  .reveal.in{opacity:1;transform:none;}

  /* ============ LOGIN GATE ============ */
  #login-gate{
    position:fixed;inset:0;z-index:1000;
    background:radial-gradient(120% 120% at 50% 0%, var(--blue-800) 0%, var(--blue-900) 45%, var(--ink) 100%);
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    overflow-y:auto;
  }
  #login-gate::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
    background-size:48px 48px;
    mask-image:radial-gradient(80% 70% at 50% 40%, #000 0%, transparent 80%);
  }
  .login-card{
    position:relative;z-index:2;
    width:100%;max-width:420px;
    background:rgba(255,255,255,.06);
    border:1px solid var(--line);
    border-radius:var(--radius-l);
    padding:40px 36px;
    backdrop-filter:blur(20px);
    box-shadow:0 30px 80px rgba(2,4,30,.5);
    animation:floatUp .7s cubic-bezier(.16,.84,.44,1) both;
  }
  @keyframes floatUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
  .login-logo{display:flex;align-items:center;gap:14px;margin-bottom:28px;}
  .login-logo img{height:52px;width:auto;}
  .login-logo .lt{display:flex;flex-direction:column;line-height:1.05;}
  .login-logo .lt .name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;color:var(--white);}
  .login-logo .lt .tag{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);margin-top:3px;}
  .login-card h1{
    font-family:'Montserrat',sans-serif;font-style:italic;font-weight:800;
    font-size:30px;line-height:1.05;color:var(--white);margin:0 0 6px;
  }
  .login-card .sub{color:var(--text-dim);font-size:14px;margin:0 0 26px;line-height:1.5;}
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);margin-bottom:8px;}
  .field input,.field textarea,.field select{
    width:100%;padding:13px 16px;border-radius:999px;
    background:rgba(255,255,255,.08);border:1px solid var(--line);
    color:var(--white);font-size:15px;outline:none;
    transition:border-color .2s ease,background .2s ease;
  }
  .field input::placeholder,.field textarea::placeholder{color:var(--text-faint);}
  .field input:focus,.field textarea:focus,.field select:focus{
    border-color:var(--blue-accent);background:rgba(255,255,255,.12);
  }
  .login-error{color:#FF6B6B;font-size:13px;min-height:18px;margin-bottom:10px;font-weight:500;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:14px 26px;border-radius:999px;font-weight:700;font-size:14.5px;
    letter-spacing:.01em;transition:transform .2s cubic-bezier(.16,.84,.44,1),box-shadow .2s ease,background .2s ease;
    border:none;cursor:pointer;text-decoration:none;white-space:nowrap;
  }
  .btn-primary{background:var(--blue-700);color:var(--white);box-shadow:0 8px 24px rgba(17,24,245,.35);}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(17,24,245,.45);background:var(--blue-accent);}
  .btn-dark{background:var(--ink);color:var(--white);}
  .btn-dark:hover{transform:translateY(-2px);background:#0d0e1a;}
  .btn-ghost{background:transparent;color:var(--white);border:1px solid var(--line);}
  .btn-ghost:hover{background:rgba(255,255,255,.08);transform:translateY(-2px);}
  .btn-sm{padding:9px 16px;font-size:13px;}
  .btn-block{width:100%;}
  .login-card .btn-block{margin-top:4px;}
  .login-hint{margin-top:18px;text-align:center;font-size:12px;color:var(--text-faint);}
  .login-hint code{background:rgba(255,255,255,.1);padding:2px 8px;border-radius:6px;color:var(--white);font-size:11px;}

  /* ============ DASHBOARD SHELL ============ */
  #dashboard{display:none;min-height:100vh;}
  #dashboard.open{display:block;}

  .topbar{
    position:sticky;top:0;z-index:50;
    height:var(--nav-h);
    background:linear-gradient(180deg,rgba(6,9,55,.98),rgba(6,9,55,.94));
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;
    padding-inline:calc(var(--gap)*3);
  }
  .topbar-left{display:flex;align-items:center;gap:16px;}
  .topbar .logo{display:flex;align-items:center;gap:12px;}
  .topbar .logo img{height:42px;width:auto;}
  .topbar .logo .lt{display:flex;flex-direction:column;line-height:1.05;}
  .topbar .logo .lt .name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:var(--white);}
  .topbar .logo .lt .tag{font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);margin-top:2px;}
  .menu-toggle{display:none;background:transparent;color:var(--white);font-size:24px;padding:6px;}
  .topbar-right{display:flex;align-items:center;gap:12px;}
  .live-pill{
    display:flex;align-items:center;gap:8px;
    padding:7px 14px;border-radius:999px;
    background:rgba(17,24,245,.18);border:1px solid rgba(17,24,245,.4);
    color:var(--white);font-size:12.5px;font-weight:600;
  }
  .live-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}70%{box-shadow:0 0 0 10px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}

  .shell{display:flex;align-items:flex-start;}
  .sidebar{
    width:var(--sidebar-w);flex:none;
    position:sticky;top:var(--nav-h);
    height:calc(100vh - var(--nav-h));
    overflow-y:auto;
    background:linear-gradient(180deg,var(--blue-900),var(--ink));
    border-right:1px solid var(--line);
    padding:18px 14px;
  }
  .sidebar::-webkit-scrollbar{width:6px;}
  .sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:6px;}
  .nav-section-label{
    font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);
    padding:14px 12px 8px;
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    cursor:pointer;user-select:none;transition:color .2s ease;
  }
  .nav-section-label:hover{color:var(--text-dim);}
  .nav-section-label .ni-chevron{width:13px;height:13px;flex:none;color:var(--text-faint);transition:transform .25s ease;}
  .nav-section-label.is-collapsed .ni-chevron{transform:rotate(-90deg);}
  .nav-group{display:grid;grid-template-rows:1fr;transition:grid-template-rows .28s ease;}
  .nav-group.is-collapsed{grid-template-rows:0fr;}
  .nav-group-inner{overflow:hidden;min-height:0;display:flex;flex-direction:column;}
  .nav-item{
    display:flex;align-items:center;gap:12px;
    padding:11px 14px;border-radius:14px;
    color:var(--text-dim);font-size:14px;font-weight:500;
    cursor:pointer;transition:all .2s ease;
    margin-bottom:3px;position:relative;
  }
  .nav-item .ni-icon{width:22px;height:22px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--text-faint);transition:color .2s ease;}
  .nav-item:hover{background:rgba(255,255,255,.06);color:var(--white);}
  .nav-item:hover .ni-icon{color:var(--blue-accent);}
  .nav-item.active{background:linear-gradient(90deg,rgba(17,24,245,.25),rgba(17,24,245,.08));color:var(--white);font-weight:600;}
  .nav-item.active .ni-icon{color:var(--blue-accent);}
  .nav-item.active::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:60%;border-radius:3px;background:var(--blue-accent);}

  .main{flex:1;min-width:0;padding:calc(var(--gap)*4) calc(var(--gap)*5) 80px;max-width:1100px;}
  .page-head{margin-bottom:28px;}
  .page-head .eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--blue-700);margin-bottom:8px;}
  .page-head h1{font-family:'Montserrat',sans-serif;font-style:italic;font-weight:800;font-size:38px;line-height:1.05;color:var(--ink-900);margin:0 0 8px;}
  .page-head p{color:var(--ink-600);font-size:15px;line-height:1.55;margin:0;max-width:620px;}

  /* ============ CARDS / EDITORS ============ */
  .card{
    background:var(--surface-alt);border:1px solid var(--card-line);
    border-radius:var(--radius-m);padding:26px 28px;margin-bottom:20px;
    box-shadow:0 2px 12px rgba(9,11,37,.04);
  }
  .card-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;color:var(--ink-900);margin:0 0 4px;}
  .card-desc{color:var(--ink-600);font-size:13.5px;margin:0 0 20px;line-height:1.5;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  @media(max-width:760px){.grid-2,.grid-3{grid-template-columns:1fr;}}

  .efield{margin-bottom:16px;}
  .efield:last-child{margin-bottom:0;}
  .efield label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-600);margin-bottom:7px;}
  .efield .hint{font-size:11px;color:var(--ink-400);margin-top:5px;font-weight:500;}
  .efield input,.efield textarea,.efield select{
    width:100%;padding:11px 14px;border-radius:12px;
    background:var(--surface);border:1px solid var(--card-line);
    color:var(--ink-900);font-size:14px;outline:none;
    transition:border-color .2s ease,box-shadow .2s ease;
  }
  .efield input:focus,.efield textarea:focus,.efield select:focus{
    border-color:var(--blue-accent);box-shadow:0 0 0 3px rgba(59,76,255,.12);
  }
  .efield textarea{resize:vertical;min-height:80px;line-height:1.55;}
  .efield.with-img{display:flex;gap:14px;align-items:flex-start;}
  .efield.with-img .img-prev{
    width:72px;height:72px;flex:none;border-radius:12px;
    background:var(--surface);border:1px solid var(--card-line);
    overflow:hidden;display:flex;align-items:center;justify-content:center;
  }
  .efield.with-img .img-prev img{width:100%;height:100%;object-fit:cover;}
  .efield.with-img .img-prev .ph{color:var(--ink-400);font-size:10px;text-align:center;padding:4px;}
  .efield.with-img .img-input{flex:1;}

  /* ============ REPEATABLE LISTS ============ */
  .rep-list{display:flex;flex-direction:column;gap:14px;}
  .rep-item{
    border:1px solid var(--card-line);border-radius:14px;
    background:var(--surface);padding:18px;position:relative;
    transition:border-color .2s ease,box-shadow .2s ease;
  }
  .rep-item:hover{border-color:var(--blue-accent);box-shadow:0 4px 16px rgba(59,76,255,.08);}
  .rep-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
  .rep-head .rep-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14.5px;color:var(--ink-900);display:flex;align-items:center;gap:8px;}
  .rep-head .rep-badge{background:var(--blue-700);color:#fff;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;letter-spacing:.04em;}
  .rep-actions{display:flex;gap:6px;}
  .icon-btn{
    width:32px;height:32px;border-radius:9px;border:1px solid var(--card-line);
    background:var(--surface-alt);color:var(--ink-600);display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:all .18s ease;
  }
  .icon-btn:hover{color:var(--blue-700);border-color:var(--blue-accent);transform:translateY(-1px);}
  .icon-btn.danger:hover{color:#e03131;border-color:#e03131;}
  .icon-btn svg{width:16px;height:16px;}

  .feature-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .feature-row input{flex:1;}
  .add-feature{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--blue-700);cursor:pointer;padding:6px 4px;}
  .add-feature:hover{color:var(--blue-accent);}

  /* popular-toggle + nested package lists (services page editor) */
  .toggle-row{display:flex;align-items:center;gap:10px;margin-top:6px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink-600);}
  .toggle-row input{width:18px;height:18px;accent-color:var(--blue-700);cursor:pointer;}
  .toggle-row:hover{color:var(--ink-900);}
  .pkg-list{display:flex;flex-direction:column;gap:14px;margin:6px 0 10px;padding-left:14px;border-left:2px solid var(--card-line);}
  .pkg-list .rep-item{background:rgba(59,76,255,.03);}
  .sub-add{border-radius:12px;padding:11px;font-size:13px;margin-top:6px;}
  .rep-badge{background:var(--blue-700);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:999px;margin-left:6px;}

  .add-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;padding:14px;border-radius:14px;
    border:2px dashed var(--card-line);background:transparent;
    color:var(--ink-600);font-size:14px;font-weight:600;cursor:pointer;
    transition:all .2s ease;
  }
  .add-btn:hover{border-color:var(--blue-accent);color:var(--blue-700);background:rgba(59,76,255,.04);}

  /* ============ SAVE BAR ============ */
  .save-bar{
    position:sticky;bottom:0;z-index:30;
    background:rgba(255,255,255,.92);backdrop-filter:blur(12px);
    border-top:1px solid var(--card-line);
    padding:14px calc(var(--gap)*5);
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    margin-inline:calc(var(--gap)*-5);margin-bottom:0;
    box-shadow:0 -4px 20px rgba(9,11,37,.06);
  }
  .save-bar .status{font-size:13px;font-weight:600;color:var(--ink-600);display:flex;align-items:center;gap:8px;}
  .save-bar .status .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-400);}
  .save-bar .status.saved .dot{background:#22c55e;}
  .save-bar .status.dirty .dot{background:#f59e0b;}
  .save-bar .actions{display:flex;gap:10px;}

  /* ============ PREVIEW PANEL ============ */
  .preview-toggle{
    position:fixed;bottom:24px;right:24px;z-index:60;
    display:flex;flex-direction:column;gap:10px;
  }
  .preview-fab{
    width:54px;height:54px;border-radius:50%;
    background:var(--blue-700);color:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 28px rgba(17,24,245,.4);
    cursor:pointer;transition:transform .2s ease,background .2s ease;
  }
  .preview-fab:hover{transform:scale(1.08) translateY(-2px);background:var(--blue-accent);}
  .preview-fab svg{width:24px;height:24px;}

  #preview-overlay{
    position:fixed;inset:0;z-index:200;display:none;
    background:rgba(5,6,11,.6);backdrop-filter:blur(6px);
    align-items:center;justify-content:center;padding:24px;
  }
  #preview-overlay.open{display:flex;}
  .preview-modal{
    width:100%;max-width:1180px;height:88vh;
    background:var(--white);border-radius:var(--radius-l);overflow:hidden;
    display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(2,4,30,.5);
    animation:floatUp .4s cubic-bezier(.16,.84,.44,1) both;
  }
  .preview-modal-head{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 20px;background:var(--blue-900);color:#fff;
  }
  .preview-modal-head h3{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;margin:0;}
  .preview-tabs{display:flex;gap:6px;}
  .preview-tab{
    padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;
    background:rgba(255,255,255,.08);color:var(--text-dim);cursor:pointer;transition:all .18s ease;border:1px solid transparent;
  }
  .preview-tab:hover{color:#fff;background:rgba(255,255,255,.14);}
  .preview-tab.active{background:var(--blue-700);color:#fff;border-color:var(--blue-accent);}
  .preview-close{background:rgba(255,255,255,.1);color:#fff;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;}
  .preview-close:hover{background:rgba(255,255,255,.2);}
  .preview-frame-wrap{flex:1;position:relative;background:#fff;}
  .preview-frame-wrap iframe{width:100%;height:100%;border:0;}

  /* ============ TOAST ============ */
  #toast{
    position:fixed;top:84px;left:50%;transform:translateX(-50%) translateY(-20px);
    z-index:300;opacity:0;pointer-events:none;
    background:var(--ink);color:#fff;padding:13px 24px;border-radius:999px;
    font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(2,4,30,.3);
    transition:opacity .3s ease,transform .3s ease;display:flex;align-items:center;gap:9px;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #toast .td{width:8px;height:8px;border-radius:50%;background:#22c55e;}

  /* ============ RESPONSIVE ============ */
  @media(max-width:920px){
    :root{--sidebar-w:0px;}
    .sidebar{
      position:fixed;top:var(--nav-h);left:0;height:calc(100vh - var(--nav-h));z-index:45;
      width:280px;transform:translateX(-100%);transition:transform .3s cubic-bezier(.16,.84,.44,1);
    }
    .sidebar.open{transform:translateX(0);}
    .menu-toggle{display:flex;}
    .main{padding-inline:calc(var(--gap)*3);}
    .save-bar{margin-inline:calc(var(--gap)*-3);padding-inline:calc(var(--gap)*3);}
  }
  @media(max-width:520px){
    .page-head h1{font-size:28px;}
    .topbar .logo .lt{display:none;}
    .live-pill span:not(.live-dot){display:none;}
  }
  .sb-backdrop{display:none;position:fixed;inset:var(--nav-h) 0 0 0;background:rgba(5,6,11,.4);z-index:44;}
  .sb-backdrop.open{display:block;}
</style>
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body data-page="dashboard">

<!-- ===================== LOGIN GATE ===================== -->
<div id="login-gate">
  <form class="login-card" id="login-form">
    <div class="login-logo">
      <img src="https://i.postimg.cc/jSdtxk2y/1.png" alt="RGT" />
      <div class="lt"><span class="name">Rare Grade Tech</span><span class="tag">Admin Dashboard</span></div>
    </div>
    <h1>Welcome Back</h1>
    <p class="sub">Sign in to manage your website content. Changes publish instantly across all open pages.</p>
    <div class="field">
      <label>Admin Password</label>
      <input type="password" id="login-pass" placeholder="Enter your password" autocomplete="current-password" />
    </div>
    <div class="login-error" id="login-error"></div>
    <button type="submit" class="btn btn-primary btn-block">Sign In →</button>
    <div class="login-hint">Default password: <code>admin123</code></div>
  </form>
</div>

<!-- ===================== DASHBOARD ===================== -->
<div id="dashboard">
  <header class="topbar">
    <div class="topbar-left">

  function deepMerge(base, override) {
    if (Array.isArray(base)) {
      return Array.isArray(override) ? override : base;
    }
    if (base && typeof base === 'object' && override && typeof override === 'object') {
      var out = {};
      var keys = Object.keys(base);
      for (var i = 0; i < keys.length; i++) {
        var k = keys[i];
        if (k in override) out[k] = deepMerge(base[k], override[k]);
        else out[k] = base[k];
      }
      // include any extra keys from override
      var okeys = Object.keys(override);
      for (var j = 0; j < okeys.length; j++) {
        if (!(okeys[j] in out)) out[okeys[j]] = override[okeys[j]];
      }
      return out;
    }
    return (override === undefined) ? base : override;
  }

  /* ---------- local cache: instant first paint + offline fallback ---------- */
  function readCache() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function writeCache(content) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(content)); } catch (e) {}
  }

  var current = deepMerge(DEFAULT_CONTENT, readCache() || {});
  var listeners = [];

  function notify(content) {
    for (var i = 0; i < listeners.length; i++) {
      try { listeners[i](content); } catch (e) {}
    }
  }

  /* ---------- Firebase: live source of truth ---------- */
  var db = null;
  var firebaseReady = firebaseConfig.apiKey !== 'YOUR_API_KEY';
  try {
    if (global.firebase && firebaseReady) {
      global.firebase.initializeApp(firebaseConfig);
      db = global.firebase.database();
      db.ref(DB_PATH).on('value', function (snap) {
        var v = snap.val();
        if (v) {
          current = deepMerge(DEFAULT_CONTENT, v);
          writeCache(current);
          notify(current);
        }
      }, function (err) {
        console.warn('RGTContent: Firebase read blocked — check your database rules.', err);
      });
    } else if (!firebaseReady) {
      console.warn('RGTContent: firebaseConfig is still a placeholder — running in local-only mode (changes will NOT sync to other devices). See content.js.');
    }
  } catch (e) {
    console.warn('RGTContent: Firebase unavailable, running in local-only mode.', e);
  }

  function getContent() {
    return JSON.parse(JSON.stringify(current));
  }

  function saveContent(content) {
    current = deepMerge(DEFAULT_CONTENT, content);
    writeCache(current);
    if (db) {
      db.ref(DB_PATH).set(content).catch(function (err) {
        console.error('RGTContent: publish failed — check your Firebase config/rules.', err);
      });
      // Firebase's own listener above fires immediately on this tab too
      // (local echo) and will call notify() with the published content.
    } else {
      notify(current); // no Firebase configured yet — still update this tab
    }
  }

  function resetContent() {
    var c = JSON.parse(JSON.stringify(DEFAULT_CONTENT));
    current = c;
    writeCache(c);
    if (db) {
      db.ref(DB_PATH).set(c).catch(function (err) {
        console.error('RGTContent: reset failed to publish — check your Firebase config/rules.', err);
      });
    } else {
      notify(c);
    }
    return c;
  }

  // Subscribe to live updates. callback(content) called on any change —
  // from this tab's own publish, or from Firebase (another admin/device).
  function subscribe(callback) {
    listeners.push(callback);
  }

  global.RGTContent = {
    DEFAULT_CONTENT: DEFAULT_CONTENT,
    getContent: getContent,
    saveContent: saveContent,
    resetContent: resetContent,
    subscribe: subscribe,
    STORAGE_KEY: STORAGE_KEY
  };

})(window);

</script>

  /* ---------- Reveal observer helper ---------- */
  function observeReveals(selector) {
    if (!('IntersectionObserver' in window)) {
      document.querySelectorAll(selector).forEach(function (el) { el.classList.add('is-visible'); });
      return;
    }
    var obs = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          obs.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    document.querySelectorAll(selector).forEach(function (el) { obs.observe(el); });
  }

<!-- site-runtime.js : Site runtime glue (initial render + live subscription; no-op on dashboard page) -->
<script>
/* =====================================================================
   Rare Grade Tech — Site Runtime glue
   Exposes re-init functions for marquees / portfolio filter so that
   render.js can re-initialise them after a live content update.
   Also performs the initial render + subscribes to live updates.
   ===================================================================== */
(function (global) {
  'use strict';

  function isHome() { return !!document.querySelector('.hero#home, #home.hero, section.hero#home') || document.body.getAttribute('data-page') === 'home'; }
  function isPortfolio() { return document.body.getAttribute('data-page') === 'portfolio' || !!document.querySelector('.hero--portfolio'); }
  function isServices() { return document.body.getAttribute('data-page') === 'services' || !!document.querySelector('.hero--services'); }

  // ---- Trusted logos marquee (extracted from inline script, re-initable) ----
  global.RGTInitTrusted = function () {
    var marquee = document.querySelector('#trusted-logos .logo-marquee, .trusted-logos .logo-marquee');
    if (!marquee) return;
    var tracks = marquee.querySelectorAll('.logo-track');
    if (!tracks.length) return;
    var firstTrack = tracks[0];
    if (tracks.length > 1) { for (var i = 1; i < tracks.length; i++) tracks[i].remove(); }
    var track = marquee.querySelector('.logo-track');
    if (!track) return;
    track.id = 'trustedTrack';
    marquee.id = 'trustedMarquee';
    var originalItems = Array.from(track.children);
    if (!originalItems.length) return;
    for (var k = 0; k < 2; k++) {
      originalItems.forEach(function (item) {
        var clone = item.cloneNode(true);
        clone.setAttribute('aria-hidden', 'true');
        track.appendChild(clone);
      });
    }
    var x = 0, baseSpeed = 0.8, currentSpeed = baseSpeed, targetSpeed = baseSpeed;
    var isHovering = false, rafId = null, halfWidth = 0, isDragging = false, startX = 0, startTranslate = 0;
    function calcHalf() {
      var w = 0;
      for (var i = 0; i < originalItems.length; i++) {
        var el = track.children[i]; if (!el) continue;
        w += el.getBoundingClientRect().width + 72;
      }
      halfWidth = w;
    }
    var easeOut = 0.02, easeIn = 0.05;
    function animate() {
      var lerp = (targetSpeed < currentSpeed) ? easeOut : easeIn;
      currentSpeed += (targetSpeed - currentSpeed) * lerp;
      if (Math.abs(targetSpeed - currentSpeed) < 0.01) { if (targetSpeed === 0) currentSpeed = Math.max(0, currentSpeed - 0.01); }
      if (!isDragging) { x -= currentSpeed; if (Math.abs(x) >= halfWidth) x = 0; track.style.transform = 'translate3d(' + x + 'px,0,0)'; }

        openDashboard();
        return;
      }
    } catch (e) {}

    form.addEventListener('submit', function (e) {
      e.preventDefault();

        var isCollapsed = collapsed.indexOf(item.group) !== -1;
        html += '<div class="nav-section-label' + (isCollapsed ? ' is-collapsed' : '') + '" data-group="' + esc(item.group) + '"><span>' + esc(item.group) + '</span><span class="ni-chevron">' + IC.down + '</span></div>';
        html += '<div class="nav-group' + (isCollapsed ? ' is-collapsed' : '') + '" data-group-items="' + esc(item.group) + '"><div class="nav-group-inner">';
        groupOpen = true;
        return;
      }
      html += '<div class="nav-item" data-key="' + item.key + '"><span class="ni-icon">' + item.icon + '</span><span>' + esc(item.label) + '</span></div>';
    });
    if (groupOpen) html += '</div></div>';
    sb.innerHTML = html;
    $all('.nav-item', sb).forEach(function (el) {
      el.addEventListener('click', function () {
        showSection(el.getAttribute('data-key'));
        // close mobile sidebar
        $('#sidebar').classList.remove('open');
        $('#sb-backdrop').classList.remove('open');
      });
    });
    $all('.nav-section-label', sb).forEach(function (label) {
      label.addEventListener('click', function () {
        var group = label.getAttribute('data-group');
        var wrap = sb.querySelector('.nav-group[data-group-items="' + group + '"]');
        if (!wrap) return;
        var nowCollapsed = wrap.classList.toggle('is-collapsed');
        label.classList.toggle('is-collapsed', nowCollapsed);
        setGroupCollapsed(group, nowCollapsed);
      });
    });
  }

  function setActiveNav(key) {

     ===================================================================== */
  function showSection(key) {
    currentSection = key;
    setActiveNav(key);
    var main = $('#main');
    var label = '';
    NAV.forEach(function (n) { if (n.key === key) label = n.label; });
    var html = '<div class="page-head"><div class="eyebrow">Content Editor</div><h1>' + esc(label) + '</h1><p id="sec-desc"></p></div><div id="editor-area"></div>';
    main.innerHTML = html;

    var area = $('#editor-area');
    var desc = $('#sec-desc');
    var builders = {
      settings: buildSettings, hero: buildHero, trusted: buildTrusted,
      services: buildServices, solutions: buildSolutions, showcase: buildShowcase,
      whyChooseUs: buildWhy, process: buildProcess, testimonials: buildTestimonials,
      portal: buildPortal, contact: buildContact, footer: buildFooter,
      portfolio: buildPortfolio,
      servicesPage: buildServicesPage
    };
    if (builders[key]) {
      builders[key](area, desc);
    }
    // observe reveals
    $all('.reveal', main).forEach(function (el) {
      var io = new IntersectionObserver(function (ents) {
        ents.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } });
      }, { threshold: 0.12 });
      io.observe(el);
    });
    attachSaveBar(main);
  }

  /* =====================================================================

     ===================================================================== */
  function sectionHead(area, title, desc) {
    var card = document.createElement('div');
    card.className = 'card reveal';
    card.innerHTML = '<div class="card-title">' + esc(title) + '</div><div class="card-desc">' + esc(desc) + '</div><div class="card-body"></div>';
    area.appendChild(card);

  }

  // text input field
  function field(label, value, key, opts) {
    opts = opts || {};
    var ph = opts.placeholder ? ' placeholder="' + esc(opts.placeholder) + '"' : '';
    var hint = opts.hint ? '<div class="hint">' + esc(opts.hint) + '</div>' : '';
    var multi = opts.multiline;
    var inp = multi
      ? '<textarea data-k="' + esc(key) + '"' + ph + '>' + esc(value) + '</textarea>'
      : '<input type="text" data-k="' + esc(key) + '" value="' + esc(value) + '"' + ph + ' />';
    return '<div class="efield"><label>' + esc(label) + '</label>' + inp + hint + '</div>';
  }

  // image field with preview
  function imgField(label, value, key) {
    var prev = value ? '<img src="' + esc(value) + '" alt=""/>' : '<span class="ph">No image</span>';
    return '<div class="efield with-img"><div class="img-prev">' + prev + '</div><div class="img-input"><label>' + esc(label) + '</label><input type="text" data-k="' + esc(key) + '" value="' + esc(value) + '" placeholder="https://..." /><div class="hint">Paste an image URL. Preview updates as you type.</div></div></div>';
  }

  // bind a flat group of data-k fields back into an object
  function bindGroup(cardBody, obj) {
    $all('[data-k]', cardBody).forEach(function (el) {
      el.addEventListener('input', function () {
        obj[el.getAttribute('data-k')] = el.value;
        markDirty();
        // live image preview update
        if (el.tagName === 'INPUT' && el.closest('.with-img')) {
          var prev = el.closest('.with-img').querySelector('.img-prev');
          var v = el.value.trim();
          prev.innerHTML = v ? '<img src="' + esc(v) + '" alt=""/>' : '<span class="ph">No image</span>';
        }
      });
    });
  }

  function markDirty() {
    dirty = true;
    var st = $('#save-status');
    if (st) {
      st.className = 'status dirty';
      st.querySelector('.status-text').textContent = 'Unsaved changes';
    }
  }
  function markSaved() {
    dirty = false;
    var st = $('#save-status');
    if (st) {
      st.className = 'status saved';
      st.querySelector('.status-text').textContent = 'All changes published';
    }
  }

  /* ---------- repeatable list helpers ---------- */
  function repItemWrap(title, badge) {
    return '<div class="rep-item"><div class="rep-head"><div class="rep-title">' + esc(title) + ' ' + (badge ? '<span class="rep-badge">' + esc(badge) + '</span>' : '') + '</div><div class="rep-actions"></div></div><div class="rep-body"></div></div>';
  }
  function repActions(idx, total) {
    var h = '';
    h += '<div class="icon-btn" data-act="up"' + (idx === 0 ? ' style="opacity:.35;pointer-events:none"' : '') + '>' + IC.up + '</div>';
    h += '<div class="icon-btn" data-act="down"' + (idx === total - 1 ? ' style="opacity:.35;pointer-events:none"' : '') + '>' + IC.down + '</div>';
    h += '<div class="icon-btn danger" data-act="del">' + IC.trash + '</div>';
    return h;
  }

  function moveItem(arr, from, to) {
    if (to < 0 || to >= arr.length) return;
    var it = arr.splice(from, 1)[0];
    arr.splice(to, 0, it);
  }

  // features list editor (array of strings)
  function featuresEditor(features) {
    var h = '<div class="efield"><label>Features</label><div class="features-list">';
    features.forEach(function (f, i) {
      h += '<div class="feature-row" data-fi="' + i + '"><input type="text" value="' + esc(f) + '" /><div class="icon-btn danger" data-fdel>' + IC.del + '</div></div>';
    });
    h += '</div><div class="add-feature" data-fadd>' + IC.add + ' <span>Add feature</span></div></div>';
    return h;
  }

  function bindFeatures(el, arr, onChange) {
    var list = el.querySelector('.features-list');
    function refresh() {
      arr.length = 0;
      $all('.feature-row input', list).forEach(function (inp) { arr.push(inp.value); });
      onChange();
    }
    $all('.feature-row input', list).forEach(function (inp) {
      inp.addEventListener('input', refresh);
    });
    $all('[data-fdel]', list).forEach(function (btn) {
      btn.addEventListener('click', function () {
        btn.closest('.feature-row').remove();
        refresh();
        markDirty();
      });
    });
    el.querySelector('[data-fadd]').addEventListener('click', function () {
      var row = document.createElement('div');
      row.className = 'feature-row';
      row.innerHTML = '<input type="text" value="" placeholder="New feature..." /><div class="icon-btn danger" data-fdel>' + IC.del + '</div>';
      list.appendChild(row);
      row.querySelector('input').addEventListener('input', refresh);
      row.querySelector('[data-fdel]').addEventListener('click', function () {
        row.remove(); refresh(); markDirty();
      });
      row.querySelector('input').focus();
      markDirty();
    });
  }

  // Generic: array of objects with text fields (+ optional multiline)
  function buildRepList(card, arr, keys, labels, titleFn, opts) {
    opts = opts || {};
    var multilineKeys = opts.multilineKeys || [];
    var body = card.querySelector('.card-body') || card;
    body.innerHTML = '<div class="rep-list"></div><div class="add-btn" data-add>' + IC.add + ' <span>Add new item</span></div>';
    var list = body.querySelector('.rep-list');
    function render() {
      list.innerHTML = '';
      arr.forEach(function (it, i) {
        var wrap = document.createElement('div');
        wrap.innerHTML = repItemWrap(titleFn(it, i), '#' + (i + 1));
        var rep = wrap.firstChild;
        rep.querySelector('.rep-actions').innerHTML = repActions(i, arr.length);
        var rb = rep.querySelector('.rep-body');
        var fieldsHtml = '';
        keys.forEach(function (k, ki) {
          var isMulti = multilineKeys.indexOf(k) !== -1;
          fieldsHtml += field(labels[ki], it[k], k, { multiline: isMulti });
        });
        // split into grid if 2 fields
        if (keys.length === 2) {
          rb.innerHTML = '<div class="grid-2">' + fieldsHtml + '</div>';
        } else if (keys.length > 2) {
          // pair first two, rest full width
          if (keys.length >= 2 && !multilineKeys.length) {
            var first2 = '<div class="grid-2">' + field(labels[0], it[keys[0]], keys[0]) + field(labels[1], it[keys[1]], keys[1]) + '</div>';
            var rest = '';
            for (var r = 2; r < keys.length; r++) {
              rest += field(labels[r], it[keys[r]], keys[r], { multiline: multilineKeys.indexOf(keys[r]) !== -1 });
            }
            rb.innerHTML = first2 + rest;
          } else {
            rb.innerHTML = fieldsHtml;
          }
        } else {
          rb.innerHTML = fieldsHtml;
        }
        list.appendChild(rep);
        // bind fields
        $all('[data-k]', rb).forEach(function (el) {
          el.addEventListener('input', function () {
            it[el.getAttribute('data-k')] = el.value;
            markDirty();
            // update title live
            rep.querySelector('.rep-title').firstChild.textContent = titleFn(it, i) + ' ';
          });
        });
        // bind actions
        bindRepActions(rep, arr, i, render, titleFn);
      });
    }
    render();
    body.querySelector('[data-add]').addEventListener('click', function () {
      var newObj = {};
      keys.forEach(function (k) { newObj[k] = ''; });
      arr.push(newObj);
      markDirty();
      render();
      // scroll to new item
      var last = list.lastChild;
      if (last) last.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  }

      arr.forEach(function (it, i) {
        var wrap = document.createElement('div');
        wrap.innerHTML = repItemWrap('Line ' + (i + 1), '#' + (i + 1));
        var rep = wrap.firstChild;
        rep.querySelector('.rep-actions').innerHTML = repActions(i, arr.length);
        var rb = rep.querySelector('.rep-body');
        var opts = icons.map(function (ic) { return '<option value="' + ic + '"' + (it.icon === ic ? ' selected' : '') + '>' + ic + '</option>'; }).join('');
        rb.innerHTML = '<div class="grid-3"><div class="efield"><label>Icon</label><select data-k="icon">' + opts + '</select></div>' + '<div class="efield" style="grid-column:span 2">' + field('Text', it.text, 'text') + '</div></div>';
        rb.querySelector('.rep-body') || (rb.innerHTML = rb.innerHTML); // ensure
        // re-fix: simpler approach
        rb.innerHTML = '<div class="efield"><label>Icon</label><select data-k="icon">' + opts + '</select></div>' + field('Text', it.text, 'text');
        list.appendChild(rep);
        $all('[data-k]', rb).forEach(function (el) {
          el.addEventListener('input', function () { it[el.getAttribute('data-k')] = el.value; markDirty(); });
          if (el.tagName === 'SELECT') el.addEventListener('change', function () { it[el.getAttribute('data-k')] = el.value; markDirty(); });
        });
        bindRepActions(rep, arr, i, render, function () { return 'Line ' + (i + 1); });
      });
    }
    // bind title field
    $all('[data-k]', body).forEach(function (el) {
      if (el === body.querySelector('[data-k="title"]')) {
        el.addEventListener('input', function () { colObj.title = el.value; markDirty(); });
      }
    });
    render();
    body.querySelector('[data-add]').addEventListener('click', function () {
      arr.push({ icon: 'phone', text: '' });
      markDirty();
      render();
      var last = list.lastChild;
      if (last) last.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  }

  // Footer links column (title + array of {label, href})
  function buildFooterLinks(card, colObj) {
    var body = card.querySelector('.card-body') || card;
    body.innerHTML = field('Column Title', colObj.title, 'title') + '<div class="rep-list"></div><div class="add-btn" data-add>' + IC.add + ' <span>Add link</span></div>';
    var list = body.querySelector('.rep-list');
    var arr = colObj.links;
    function render() {
      list.innerHTML = '';
      arr.forEach(function (it, i) {
        var wrap = document.createElement('div');
        wrap.innerHTML = repItemWrap(it.label || ('Link ' + (i + 1)), '#' + (i + 1));
        var rep = wrap.firstChild;
        rep.querySelector('.rep-actions').innerHTML = repActions(i, arr.length);
        var rb = rep.querySelector('.rep-body');
        rb.innerHTML = '<div class="grid-2">' + field('Label', it.label, 'label') + field('Link (href)', it.href, 'href') + '</div>';
        list.appendChild(rep);
        $all('[data-k]', rb).forEach(function (el) {
          el.addEventListener('input', function () {
            it[el.getAttribute('data-k')] = el.value;
            markDirty();
            rep.querySelector('.rep-title').firstChild.textContent = (it.label || ('Link ' + (i + 1))) + ' ';
          });
        });
        bindRepActions(rep, arr, i, render, function () { return it.label || ('Link ' + (i + 1)); });
      });
    }
    // bind title
    var titleEl = body.querySelector('[data-k="title"]');
    if (titleEl) titleEl.addEventListener('input', function () { colObj.title = titleEl.value; markDirty(); });
    render();
    body.querySelector('[data-add]').addEventListener('click', function () {
      arr.push({ label: '', href: '#' });
      markDirty();
      render();
      var last = list.lastChild;
      if (last) last.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  }

  // Simple features list (array of strings) — for portal features
  function buildSimpleFeatures(card, arr) {
    var body = card.querySelector('.card-body') || card;
    body.innerHTML = featuresEditor(arr);
    bindFeatures(body, arr, markDirty);
  }

  // Portfolio projects (complex: indexLabel, title, desc, categories, tags, features, cta, image)
  function buildRepListProjects(card, arr, titleFn) {
    var body = card.querySelector('.card-body') || card;
    body.innerHTML = '<div class="rep-list"></div><div class="add-btn" data-add>' + IC.add + ' <span>Add project</span></div>';
    var list = body.querySelector('.rep-list');
    function render() {
      list.innerHTML = '';
      arr.forEach(function (it, i) {
        var wrap = document.createElement('div');
        wrap.innerHTML = repItemWrap(titleFn(it, i), '#' + (i + 1));
        var rep = wrap.firstChild;
        rep.querySelector('.rep-actions').innerHTML = repActions(i, arr.length);
        var rb = rep.querySelector('.rep-body');
        var html = '';
        html += field('Index Label', it.indexLabel, 'indexLabel', { hint: 'e.g. 01 — Web & Mobile Apps' });
        html += field('Title', it.title, 'title');
        html += field('Description', it.desc, 'desc', { multiline: true });
        html += field('Category Tags (space-separated keys)', it.categories, 'categories', { hint: 'Must match tab keys, e.g. "web-mobile design"' });
        html += featuresEditor(it.features || []);
        html += '<div class="grid-2">' + field('CTA Label', it.ctaLabel, 'ctaLabel') + '</div>';
        html = html.replace('<div class="grid-2">' + field('CTA Label', it.ctaLabel, 'ctaLabel') + '</div>', field('CTA Label', it.ctaLabel, 'ctaLabel'));
        html += imgField('Project Image', it.image, 'image');
        rb.innerHTML = html;
        list.appendChild(rep);
        $all('[data-k]', rb).forEach(function (el) {
          el.addEventListener('input', function () {
            var k = el.getAttribute('data-k');
            it[k] = el.value;
            markDirty();
            if (k === 'image' && el.tagName === 'INPUT') {
              var prev = el.closest('.with-img').querySelector('.img-prev');
              var v = el.value.trim();
              prev.innerHTML = v ? '<img src="' + esc(v) + '" alt=""/>' : '<span class="ph">No image</span>';
            }
            rep.querySelector('.rep-title').firstChild.textContent = titleFn(it, i) + ' ';
          });
        });
        bindFeatures(rb, it.features, markDirty);
        bindRepActions(rep, arr, i, render, titleFn);
      });
    }
    render();
    body.querySelector('[data-add]').addEventListener('click', function () {
      arr.push({ indexLabel: '', title: '', desc: '', tags: [], categories: '', features: [], ctaLabel: '', image: '' });
      markDirty();
      render();
      var last = list.lastChild;
      if (last) last.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  }

  /* ---------- rep actions (up/down/delete) ---------- */
  function bindRepActions(rep, arr, idx, render, titleFn) {
    $all('[data-act]', rep).forEach(function (btn) {
      btn.addEventListener('click', function () {
        var act = btn.getAttribute('data-act');
        if (act === 'del') {
          if (confirm('Delete this item?')) {
            arr.splice(idx, 1);
            markDirty();
            render();
          }
        } else if (act === 'up') {
          moveItem(arr, idx, idx - 1);
          markDirty();
          render();
        } else if (act === 'down') {
          moveItem(arr, idx, idx + 1);
          markDirty();
          render();
        }
      });
    });
  }

  /* =====================================================================
     SAVE BAR
     ===================================================================== */
  function attachSaveBar(main) {
    // remove old
    var old = $('#save-bar');
    if (old) old.remove();
    var bar = document.createElement('div');
    bar.id = 'save-bar';
    bar.className = 'save-bar';
    bar.innerHTML = '<div class="status saved" id="save-status"><span class="dot"></span><span class="status-text">All changes published</span></div><div class="actions"><button class="btn btn-ghost btn-sm" id="reset-btn">Reset to Defaults</button><button class="btn btn-primary btn-sm" id="publish-btn">Publish Changes →</button></div>';
    main.appendChild(bar);
    $('#publish-btn').addEventListener('click', publish);
    $('#reset-btn').addEventListener('click', function () {
      if (confirm('Reset ALL content back to the original defaults? This cannot be undone.')) {
        C = RGTContent.resetContent();
        toast('Content reset to defaults');
        showSection(currentSection);
        markSaved();
      }
    });
    // initial status
    if (dirty) markDirty(); else markSaved();
  }

  function publish() {
    RGTContent.saveContent(C);
    markSaved();
    toast('Changes published — live on site ✓');
    // reload preview if open
    var pv = $('#preview-frame');
    if (pv && pv.src !== 'about:blank') {
      pv.src = pv.src;
    }
  }

  /* =====================================================================
     GLOBAL CONTROLS (preview, logout, mobile menu)
     ===================================================================== */
  function initGlobalControls() {
    $('#logout-btn').addEventListener('click', logout);
    $('#open-site-btn').setAttribute('href', location.pathname.replace(/dash[^/]*\.html$/, 'home.html').replace(/[^/]*\.html$/, 'home.html'));

    // mobile menu
    $('#menu-toggle').addEventListener('click', function () {
      $('#sidebar').classList.toggle('open');
      $('#sb-backdrop').classList.toggle('open');
    });
    $('#sb-backdrop').addEventListener('click', function () {
      $('#sidebar').classList.remove('open');
      $('#sb-backdrop').classList.remove('open');
    });

    // preview
    $('#preview-fab').addEventListener('click', openPreview);
    $('#preview-close').addEventListener('click', closePreview);
    $all('.preview-tab').forEach(function (tab) {
      tab.addEventListener('click', function () {
        $all('.preview-tab').forEach(function (t) { t.classList.remove('active'); });
        tab.classList.add('active');
        $('#preview-frame').src = tab.getAttribute('data-pv');
      });
    });

    // keyboard: Ctrl/Cmd+S to publish
    document.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault();
        publish();
      }
    });
  }

  function openPreview() {
    var active = $('.preview-tab.active');
    var page = active ? active.getAttribute('data-pv') : 'home.html';
    $('#preview-frame').src = page;
    $('#preview-overlay').classList.add('open');
  }
  function closePreview() {
    $('#preview-overlay').classList.remove('open');
    $('#preview-frame').src = 'about:blank';
  }

  /* =====================================================================
     INIT
     ===================================================================== */
  function init() {
    C = RGTContent.getContent();
    initLogin();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();

</script>
</body>
</html>
