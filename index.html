<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rare Grade Tech | Admin Manager</title>
    <!-- Matching Fonts and Styles -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #00d2ff; /* Your site's accent blue */
            --secondary: #3a7bd5;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 260px;
            background: var(--card-bg);
            border-right: 1px solid rgba(255,255,255,0.1);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .logo-area {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 3rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-link {
            padding: 1rem;
            color: var(--text-dim);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            transition: 0.3s;
        }

        .nav-link:hover, .nav-link.active {
            background: rgba(0, 210, 255, 0.1);
            color: var(--primary);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            animation: fadeIn 0.8s ease-out;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        /* Management Forms */
        .editor-section {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: slideUp 0.6s ease-out;
        }

        h2 { margin-bottom: 1.5rem; font-size: 1.25rem; }

        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            color: var(--text-dim);
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        input, textarea, select {
            width: 100%;
            background: #0f172a;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0.8rem;
            color: white;
            border-radius: 6px;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--primary); }

        .btn-save {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-save:hover {
            opacity: 0.9;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .status-badge {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 4px;
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo-area">Rare Grade Admin</div>
        <nav>
            <a href="#" class="nav-link active"><i class="fas fa-home"></i> Overview</a>
            <a href="#" class="nav-link"><i class="fas fa-layer-group"></i> Manage Services</a>
            <a href="#" class="nav-link"><i class="fas fa-briefcase"></i> Portfolio</a>
            <a href="#" class="nav-link"><i class="fas fa-comments"></i> Testimonials</a>
            <a href="#" class="nav-link"><i class="fas fa-cog"></i> Site Settings</a>
        </nav>
    </aside>

    <main class="main-content">
        <header>
            <div>
                <h1>Management Dashboard</h1>
                <p style="color: var(--text-dim)">Control your digital presence in real-time.</p>
            </div>
            <div class="status-badge"><i class="fas fa-circle"></i> System Live</div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <label>Page Views</label>
                <div style="font-size: 1.5rem; font-weight: 700;">1,284</div>
            </div>
            <div class="stat-card">
                <label>Form Inquiries</label>
                <div style="font-size: 1.5rem; font-weight: 700;">12</div>
            </div>
            <div class="stat-card">
                <label>Active Services</label>
                <div style="font-size: 1.5rem; font-weight: 700;">6</div>
            </div>
        </div>

        <section class="editor-section">
            <h2>Edit Homepage Hero Content</h2>
            <form id="heroForm">
                <div class="input-group">
                    <label>Hero Headline</label>
                    <input type="text" id="heroTitle" value="DIGITALY TRANSFORMING BRANDS">
                </div>
                <div class="input-group">
                    <label>Hero Subtext</label>
                    <textarea id="heroDesc" rows="3">We design, develop and deliver modern software, web and mobile applications, AI solutions and IT services...</textarea>
                </div>
                <div class="input-group">
                    <label>Primary Button Text</label>
                    <input type="text" id="btnText" value="Book An Appointment">
                </div>
                
                <button type="submit" class="btn-save">
                    <i class="fas fa-sync-alt"></i> Update Live Site
                </button>
            </form>
        </section>
    </main>

    <script>
        // Example of how the real-time update works
        document.getElementById('heroForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('.btn-save');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Syncing...';
            
            // In a live Firebase setup, you would use:
            // db.ref('content/hero').update({ title: ..., desc: ... });
            
            setTimeout(() => {
                btn.innerHTML = '<i class="fas fa-check"></i> Changes Live!';
                btn.style.background = '#10b981';
                setTimeout(() => {
                    btn.innerHTML = '<i class="fas fa-sync-alt"></i> Update Live Site';
                    btn.style.background = 'linear-gradient(to right, #00d2ff, #3a7bd5)';
                }, 2000);
            }, 1000);
        });
    </script>
</body>
</html>
